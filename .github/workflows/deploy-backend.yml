name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "Caddyfile"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    # Runner registered on the self-hosted box (see README's "Continuous
    # deployment" section) — never runs on GitHub-hosted infrastructure, so
    # no inbound access to the box is required.
    runs-on: [self-hosted, loosedays]
    steps:
      - uses: actions/checkout@v4

      - name: Build and restart stack
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

      - name: Prune old images
        run: docker image prune -f
